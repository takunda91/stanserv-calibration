<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- Outer border circle -->
    <circle cx="100" cy="100" r="96" fill="none" stroke="#2b3b82" stroke-width="4" />
    <circle cx="100" cy="100" r="90" fill="none" stroke="#2b3b82" stroke-width="1.5" />

    <!-- Inner border circle -->
    <circle cx="100" cy="100" r="66" fill="none" stroke="#2b3b82" stroke-width="1.5" />

    <!-- Circular Path for Text -->
    <path id="textPathTop" d="M 22 100 A 78 78 0 1 1 178 100" fill="none" />
    <path id="textPathBottom" d="M 178 100 A 78 78 0 1 1 22 100" fill="none" />

    <!-- Text along top curve -->
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="13px" fill="#2b3b82" letter-spacing="1px">
        <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
            ISO 45001: 2018
        </textPath>
    </text>

    <!-- Text along bottom curve -->
    <text font-family="Arial, sans-serif" font-weight="bold" font-size="9.5px" fill="#2b3b82" letter-spacing="0.5px">
        <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
            MANAGEMENT SYSTEM CERTIFIED
        </textPath>
    </text>

    <!-- Decorative Stars on sides -->
    <text x="28" y="104" font-family="Arial" font-size="12px" fill="#2b3b82" text-anchor="middle">★</text>
    <text x="172" y="104" font-family="Arial" font-size="12px" fill="#2b3b82" text-anchor="middle">★</text>

    <!-- SAZ Logo Center Element (6-pointed star / emblem inside circle) -->
    <g transform="translate(100, 100)">
        <!-- Outer polygon shield / star -->
        <polygon points="0,-48 14,-22 42,-24 24,0 42,24 14,22 0,48 -14,22 -42,24 -24,0 -42,-24 -14,-22" fill="none" stroke="#2b3b82" stroke-width="2.5" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#2b3b82" stroke-width="2" />
        <!-- SAZ text inside center circle -->
        <text x="0" y="5" font-family="Arial, sans-serif" font-weight="900" font-size="14px" fill="#2b3b82" text-anchor="middle" letter-spacing="1px">SAZ</text>
    </g>
</svg>